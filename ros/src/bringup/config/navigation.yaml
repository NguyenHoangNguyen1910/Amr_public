navigation:
  ros__parameters:
    # ROS frames, topics và adapter input.
    map_frame: map                         # Frame world của SLAM/path.
    base_frame: base_footprint             # Frame gốc của robot.
    laser_frame: laser_frame               # Fallback khi LaserScan không có frame_id.
    scan_topic: /scan                      # LiDAR input.
    odom_topic: /odom                      # Velocity measured để xác nhận robot đã dừng.
    map_topic: /map                        # Occupancy grid từ SLAM.
    cmd_vel_topic: /cmd_vel_nav            # Command navigation gửi vào arbiter.
    plan_topic: /plan                      # Global path để web/debug hiển thị.
    tf_timeout_seconds: 0.30               # Chờ EKF/TF catch up với timestamp scan khi hệ thống đang tải.
    occupied_threshold: 65                 # Cell map >= giá trị này là obstacle.

    # Kích thước robot và điều kiện hoàn thành goal.
    robot_radius_m: 0.08                   # Bán kính thân robot.
    safety_margin_m: 0.02                  # Margin global map; inflation tổng là 0.10 m.
    local_safety_margin_m: 0.015           # Margin thêm khi kiểm tra LiDAR local.
    goal_tolerance_m: 0.12                 # Sai số vị trí tối đa để thành công.
    goal_terminal_entry_m: 0.20            # Vào terminal controller khi gần goal hơn mức này.
    goal_terminal_exit_m: 0.14             # Rời terminal controller khi đi xa lại quá mức này.
    goal_yaw_tolerance_rad: 0.20           # Sai số hướng tối đa tại goal có yaw.
    terminal_linear_velocity_mps: 0.08     # Tốc độ tiến chậm khi căn goal cuối.
    terminal_angular_velocity_rps: 0.35    # Tốc độ quay tối đa khi căn goal cuối.
    terminal_heading_rotate_threshold_rad: 0.40  # Lệch hướng lớn hơn mức này thì chỉ quay.
    terminal_heading_gain: 1.20            # Gain quay để hướng tới vị trí goal.
    terminal_yaw_gain: 0.90                # Gain quay để khớp yaw cuối.
    stable_linear_velocity_mps: 0.02       # Ngưỡng linear velocity coi là đứng yên.
    stable_angular_velocity_rps: 0.03      # Ngưỡng angular velocity coi là đứng yên.
    stable_goal_cycles: 5                  # Số control cycle ổn định trước khi succeed.

    # Global path và DWA local planner.
    waypoint_spacing_m: 0.25               # Khoảng cách resample waypoint của path.
    lookahead_distance_m: 0.45             # Điểm path local planner nhắm tới phía trước.
    min_linear_velocity_mps: -0.22         # Tốc độ lùi tối đa.
    default_linear_velocity_mps: 0.30      # Tốc độ tiến mục tiêu khi bám path.
    max_linear_velocity_mps: 0.30          # Trần tốc độ tiến command navigation.
    max_angular_velocity_rps: 0.55         # Trần tốc độ quay command navigation.
    linear_acceleration_mps2: 0.50         # Gia tốc linear dùng để tạo dynamic window.
    angular_acceleration_rps2: 1.20        # Gia tốc angular dùng để tạo dynamic window.
    control_hz: 5.0                        # Tần suất planner/controller xuất command.
    prediction_horizon_seconds: 1.5        # Thời gian mô phỏng mỗi DWA candidate.
    prediction_step_seconds: 0.10          # Bước thời gian mô phỏng trajectory.
    linear_samples: 7                      # Số mẫu linear velocity mỗi control cycle.
    angular_samples: 15                    # Số mẫu angular velocity mỗi control cycle.

    # Freshness, obstacle động và scoring.
    sensor_timeout_seconds: 0.60           # Scan/odom cũ hơn mức này thì abort goal.
    no_progress_timeout_seconds: 12.0      # Timeout nếu robot không tiến triển.
    minimum_progress_m: 0.04               # Tiến ít nhất mức này để reset no-progress timer.
    temporary_obstacle_ttl_seconds: 2.0    # Thời gian giữ obstacle LiDAR trong costmap.
    score_progress: 2.4                    # Trọng số tiến gần goal trong DWA score.
    score_heading: 1.5                     # Trọng số hướng về lookahead target.
    score_clearance: 2.8                   # Trọng số khoảng cách tới obstacle.
    score_speed: 0.6                       # Trọng số ưu tiên tốc độ cao hơn.
    reverse_penalty: 0.35                  # Phạt candidate lùi để chỉ lùi khi cần.
