navigation:
  ros__parameters:
    map_frame: map
    base_frame: base_footprint
    laser_frame: laser_frame
    scan_topic: /scan
    odom_topic: /odom
    map_topic: /map
    cmd_vel_topic: /cmd_vel_nav
    plan_topic: /plan
    tf_timeout_seconds: 0.10
    occupied_threshold: 65

    robot_radius_m: 0.05
    safety_margin_m: 0.05  # global inflation = 0.10 m
    local_safety_margin_m: 0.03
    goal_tolerance_m: 0.12
    goal_terminal_entry_m: 0.20
    goal_terminal_exit_m: 0.14
    goal_yaw_tolerance_rad: 0.20
    terminal_linear_velocity_mps: 0.08
    terminal_angular_velocity_rps: 0.35
    terminal_heading_rotate_threshold_rad: 0.40
    terminal_heading_gain: 1.20
    terminal_yaw_gain: 0.90
    stable_linear_velocity_mps: 0.02
    stable_angular_velocity_rps: 0.03
    stable_goal_cycles: 5
    waypoint_spacing_m: 0.25
    lookahead_distance_m: 0.45
    min_linear_velocity_mps: -0.22
    default_linear_velocity_mps: 0.30
    max_linear_velocity_mps: 0.30
    max_angular_velocity_rps: 0.55
    linear_acceleration_mps2: 0.50
    angular_acceleration_rps2: 1.20
    control_hz: 5.0
    prediction_horizon_seconds: 1.5
    prediction_step_seconds: 0.10
    linear_samples: 7
    angular_samples: 15
    sensor_timeout_seconds: 0.60
    no_progress_timeout_seconds: 12.0
    minimum_progress_m: 0.04
    temporary_obstacle_ttl_seconds: 2.0
    score_progress: 2.4
    score_heading: 1.5
    score_clearance: 2.8
    score_speed: 0.6
    reverse_penalty: 0.35
